volumes:
  pg_data:
  static_data:
  media_data:
  frontend_build:

services:
  db:
    container_name: foodgram-db
    image: postgres:16-alpine
    env_file:
      - ../backend/.env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    container_name: foodgram-backend
    build: ../backend
    env_file:
      - ../backend/.env
    volumes:
      - static_data:/app/collected_static
      - media_data:/app/media
      - ../data:/app/data:ro
    depends_on:
      - db

  frontend:
    container_name: foodgram-front-builder
    build: ../frontend
    volumes:
      - frontend_build:/app/result_build

  nginx:
    container_name: foodgram-proxy
    image: nginx:1.25.4-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_build:/usr/share/nginx/html/
      - ../docs:/usr/share/nginx/html/api/docs/:ro
      - static_data:/static/
      - media_data:/media/
    depends_on:
      - backend
      - frontend


