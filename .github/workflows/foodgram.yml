name: Main Kittygram workflow

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend_tests:
    name: Backend checks (flake8 + Django tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: foodgram_user
          POSTGRES_PASSWORD: foodgram_password
          POSTGRES_DB: foodgram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodgram_user -d foodgram_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install flake8 flake8-isort
          pip install -r backend/requirements.txt

      - name: Run flake8 (PEP 8)
        working-directory: backend
        run: python -m flake8 .

      - name: Run Django tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          DEBUG: "False"
          POSTGRES_USER: foodgram_user
          POSTGRES_PASSWORD: foodgram_password
          POSTGRES_DB: foodgram_test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: python manage.py test

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: backend_tests
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t foodgram-backend ./backend
      - name: Build frontend image
        run: docker build -t foodgram-frontend ./frontend
