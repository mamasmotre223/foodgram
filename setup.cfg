[flake8]
max-line-length = 79
exclude = */migrations/, venv/, env/, __pycache__/, .git/, data/, static/, media/
ignore = D100, D101, D102, D103, D104, D105, D106, W503, E203, I005

[isort]
profile = black
line_length = 79
skip = migrations, venv, env, __pycache__, data, static, media
known_first_party = api, core, foodgram, recipes, users
